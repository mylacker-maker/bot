<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест камеры</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        
        h1 {
            margin-bottom: 20px;
            color: #e94560;
        }
        
        #status {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        
        #video {
            width: 100%;
            max-width: 600px;
            border: 3px solid #e94560;
            border-radius: 8px;
            display: none;
        }
        
        #canvas {
            display: none;
        }
        
        .button {
            background: #e94560;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
        }
        
        .button:hover {
            background: #c73e54;
        }
        
        .button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        
        #photo {
            max-width: 100%;
            border: 3px solid #0f3460;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <h1> Тест камеры</h1>
    
    <div id="status">Нажмите кнопку для запуска камеры</div>
    
    <button id="startBtn" class="button">🎥 Включить камеру</button>
    <button id="captureBtn" class="button" disabled>📸 Сделать фото</button>
    <button id="stopBtn" class="button" disabled>⏹ Остановить</button>
    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <img id="photo" alt="Сделанное фото">

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photo = document.getElementById('photo');
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        
        let stream = null;

        // Проверка поддержки API
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            status.textContent = '❌ API камеры не поддерживается в этом браузере';
            startBtn.disabled = true;
        } else {
            status.textContent = '✅ API поддерживается. Нажми кнопку.';
        }

        // Запуск камеры
        startBtn.addEventListener('click', async () => {
            try {
                status.textContent = ' Запрос доступа к камере...';
                
                // Запрашиваем камеру и микрофон
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment', // Задняя камера
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }, 
                    audio: true 
                });
                
                video.srcObject = stream;
                video.style.display = 'block';
                
                startBtn.disabled = true;
                captureBtn.disabled = false;
                stopBtn.disabled = false;
                
                status.textContent = '✅ Камера активна!';
                
            } catch (err) {
                console.error('Ошибка доступа к камере:', err);
                
                if (err.name === 'NotAllowedError') {
                    status.textContent = '❌ Доступ к камере запрещён пользователем';
                } else if (err.name === 'NotFoundError') {
                    status.textContent = '❌ Камера не найдена';
                } else if (err.name === 'NotReadableError') {
                    status.textContent = '❌ Камера занята другим приложением';
                } else {
                    status.textContent = '❌ Ошибка: ' + err.message;
                }
            }
        });

        // Сделать фото
        captureBtn.addEventListener('click', () => {
            if (!stream) return;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            photo.src = canvas.toDataURL('image/png');
            photo.style.display = 'block';
            
            status.textContent = ' Фото сделано!';
        });

        // Остановить камеру
        stopBtn.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            video.style.display = 'none';
            video.srcObject = null;
            
            startBtn.disabled = false;
            captureBtn.disabled = true;
            stopBtn.disabled = true;
            
            status.textContent = '⏹ Камера остановлена';
        });
    </script>
</body>
</html>
