<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест — открыть Google</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #0f0f1a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    text-align: center;
}
h1 { color: #a78bfa; margin-bottom: 20px; }
button {
    padding: 20px 40px;
    background: #a78bfa;
    color: #0f0f1a;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin: 10px;
}
button:active { transform: scale(0.95); }
a {
    color: #a78bfa;
    font-size: 18px;
    text-decoration: none;
    padding: 20px 40px;
    border: 2px solid #a78bfa;
    border-radius: 12px;
    display: inline-block;
    margin: 10px;
}
</style>
</head>
<body>

<h1>Тест</h1>
<p>Жми кнопку — откроется Google в системном браузере</p>

<!-- СПОСОБ 1: Ссылка с target="_blank" -->
<a href="https://www.google.com" target="_blank">🌐 Открыть Google (способ 1)</a>

<br><br>

<!-- СПОСОБ 2: Кнопка через window.open() -->
<button onclick="window.open('https://www.google.com', '_blank')">
    🌐 Открыть Google (способ 2)
</button>

<br><br>

<!-- СПОСОБ 3: Кнопка через window.location -->
<button onclick="window.location.href='https://www.google.com'">
    🌐 Открыть Google (способ 3)
</button>

</body>
</html>
