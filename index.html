function startDrag(){const s=O().s,i=s.findIndex(b=>b.id==hold.id),j=i<0?-1:grp(s,i);if(j<0){hold=null;return}
 let mr=null;
 if(kd(s[i])=='mid'){let bal=0,p=-1,q=-1;
  for(let m=i-1;m>=0;m--){const K=kd(s[m]);if(K=='end')bal++;else if(K=='loop'){if(bal==0){p=m;break}bal--}else if(K=='hat')break}
  bal=0;for(let m=i+1;m<s.length;m++){const K=kd(s[m]);if(K=='loop')bal++;else if(K=='end'){if(bal==0){q=m;break}bal--}else if(K=='hat')break}
  mr=p>=0&&q>=0?[p+1,q-1]:[0,-1]}
 const els=[...document.querySelectorAll('main>.blk')];DG={id:hold.id,i,j,els,y0:hold.y,s0:scrollY,k:null,mr};mvId=null;hold=null;
 els.forEach(e=>e.classList.remove('mvm'));els.slice(i,j).forEach(e=>{e.classList.add('lift');e.style.transform='translate(12px,0) scale(1.04)'});
 setTimeout(()=>DG&&els.slice(i,j).forEach(e=>e.classList.add('mv')),180);try{navigator.vibrate(12)}catch(x){}}
function snap(kt){const D=DG,s=O().s,g=s.slice(D.i,D.j),red=[...s.slice(0,D.i),...s.slice(D.j)],K=kd(g[0]);let d=0;const dep=[0];
 red.forEach(b=>{const q=kd(b);if(q=='hat')d=1;else if(q=='loop')d++;else if(q=='end')d=Math.max(0,d-1);dep.push(d)});
 const n=red.length,ok=[];
 for(let k=0;k<=n;k++){const v=K=='hat'?(k==0||k==n||kd(red[k])=='hat'):K=='mid'?(k>=D.mr[0]&&k<=D.mr[1]&&dep[k]==dep[D.mr[0]]):k>=1;if(v)ok.push(k)}

let tok=0,V={},SP=[],VD=[];
const sl=ms=>new Promise(r=>setTimeout(r,ms)),fr=()=>new Promise(r=>requestAnimationFrame(r));
function run(sc){tok++;V={};$('.rc').style.display=ST.x?'':'none';$('#run').classList.add('on');$('#stage').innerHTML='';$('#ld').style.display='flex';
 setTimeout(()=>{$('#ld').style.display='none';load(sc)},450)}

function parse(s){const out=[];let st=null;for(const b of s){const K=kd(b);
 if(K=='hat'){const n={...b,c:[]};out.push(n);st=[{a:n.c}]}
 else if(!st)continue;
 else if(K=='end'){if(st.length>1)st.pop()}
 else if(K=='mid'){const top=st[st.length-1];if(top.n){const g={t:b.t,a:b.a,c:[]};top.n.segs.push(g);top.a=g.c}}
 else{const n={...b,c:[]},isIf=b.t=='if';if(isIf)n.segs=[{t:'if',a:b.a,c:n.c}];st[st.length-1].a.push(n);if(K=='loop')st.push({a:n.c,n:isIf?n:null})}}
 return out}
const fire=(sp,ty)=>sp.sc.filter(h=>h.t==ty).forEach(h=>ex(h.c,sp,tok));

 SP=sc.objects.map(o=>{const el=new Image();el.src=o.img;el.className='sp';el.draggable=false;st.appendChild(el);const sp={o,el,x:o.x||0,y:o.y||0,s:100,vis:1,sc:parse(o.s)};ap(sp);
  el.onpointerdown=()=>fire(sp,'tap');el.onpointerup=()=>fire(sp,'rel');return sp});

 (function tick(){if(t!==tok)return;VD.forEach(d=>d.el.textContent=V[d.v]??0);fc++;const n=performance.now();if(n-ft>1000){FPS=Math.round(fc*1000/(n-ft));fc=0;ft=n}requestAnimationFrame(tick)})()}
function ap(sp){const st=$('#stage'),e=sp.el.style;e.left=st.clientWidth/2+sp.x+'px';e.top=st.clientHeight/2-sp.y+'px';e.height=80*sp.s/100+'px';e.transform='translate(-50%,-50%)';e.display=sp.vis?'':'none'}
const opnd=(t,sp)=>t.k=='n'?+t.v:t.k=='t'?t.v:t.k=='v'?(V[t.v]??0):FN[t.v][1](sp,t.a);
function arith(s,sp){const a=s.map(t=>t.k=='o'?t.v:opnd(t,sp));
 for(const ops of [['*','/'],['+','-']])for(let i=1;i<a.length;i+=2)if(ops.includes(a[i])){const o=a[i],x=+a[i-1],y=+a[i+1];a.splice(i-1,3,o=='*'?x*y:o=='/'?x/y:o=='+'?x+y:x-y);i-=2}
 return a[0]}
function ev(T,sp){if(!T||!T.length)return 0;const i=T.findIndex(t=>t.k=='o'&&CMP.includes(t.v));
 if(i>=0){const x=ev(T.slice(0,i),sp),y=ev(T.slice(i+1),sp),o=T[i].v,nu=x!==''&&y!==''&&!isNaN(+x)&&!isNaN(+y),p=nu?+x:String(x),q=nu?+y:String(y);return o=='='?p==q:o=='>'?p>q:o=='<'?p<q:o=='≤'?p<=q:p>=q}
 const g=[[]];T.forEach(t=>t.k=='o'&&t.v=='..'?g.push([]):g[g.length-1].push(t));const r=g.map(s=>arith(s,sp));return r.length==1?r[0]:r.join('')}
async function ex(l,sp,t){for(const b of l){if(t!==tok)return;await stp(b,sp,t);ap(sp)}}
async function stp(b,sp,t){const a=b.a,n=k=>+ev(a[k],sp)||0;
 switch(b.t){
 case 'hide':sp.vis=0;break;case 'show':sp.vis=1;break;
 case 'cx':sp.x+=n('n');break;case 'cy':sp.y+=n('n');break;
 case 'sx':sp.x=n('n');break;case 'sy':sp.y=n('n');break;
 case 'sxy':sp.x=n('x');sp.y=n('y');break;
 case 'ssz':sp.s=Math.max(1,n('n'));break;case 'csz':sp.s=Math.max(1,sp.s+n('n'));break;
 case 'glide':{const x0=sp.x,y0=sp.y,x1=n('x'),y1=n('y'),D=n('n')*1000,t0=performance.now();let p=0;while(p<1&&t===tok){await fr();p=D>0?Math.min(1,(performance.now()-t0)/D):1;sp.x=x0+(x1-x0)*p;sp.y=y0+(y1-y0)*p;ap(sp)}break}
 case 'setv':V[a.v]=ev(a.n,sp);break;
 case 'chgv':V[a.v]=(+V[a.v]||0)+n('n');break;
 case 'showv':{const st=$('#stage'),el=document.createElement('div');el.className='vd';el.style.cssText=`left:${st.clientWidth/2+n('x')}px;top:${st.clientHeight/2-n('y')}px;font-size:${n('z')||24}px;color:${a.col};transform:translate(${{left:'0',center:'-50%',right:'-100%'}[a.al]},-50%)`;st.appendChild(el);VD.push({v:a.v,el});break}
 case 'scene':{const s=P().scenes.find(s=>s.name==a.s);if(s)load(s);break}

 case 'rep':{const c=n('n');for(let i=0;i<c&&t===tok;i++){await ex(b.c,sp,t);await fr()}break}
 case 'fe':while(t===tok){await ex(b.c,sp,t);await fr()}break;
 case 'if':{let els=null,hit=0;for(const g of b.segs){if(g.t=='else'){els=g;continue}const v=ev(g.a.c,sp);if(v===true||(+v!==0&&!isNaN(+v))){await ex(g.c,sp,t);hit=1;break}}if(!hit&&els)await ex(els.c,sp,t);break}}}
