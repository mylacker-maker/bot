<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Тест камеры</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { margin-bottom: 20px; color: #e94560; }
        #status {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        #video {
            width: 100%;
            max-width: 600px;
            border: 3px solid #e94560;
            border-radius: 8px;
            display: none;
            background: #000;
        }
        .button {
            background: #e94560;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            min-width: 200px;
        }
        .button:disabled { background: #555; cursor: not-allowed; }
        #photo {
            max-width: 100%;
            border: 3px solid #0f3460;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        #errorLog {
            background: #330000;
            color: #ff6666;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 12px;
            display: none;
            max-width: 600px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1> Тест камеры</h1>
    <div id="status">Проверка поддержки API...</div>
    <button id="startBtn" class="button">Включить камеру</button>
    <button id="captureBtn" class="button" disabled>Сделать фото</button>
    <button id="stopBtn" class="button" disabled>Остановить</button>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none"></canvas>
    <img id="photo" alt="Фото">
    <div id="errorLog"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photo = document.getElementById('photo');
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const errorLog = document.getElementById('errorLog');
        let stream = null;

        function showError(msg) {
            errorLog.style.display = 'block';
            errorLog.textContent = msg;
            console.error(msg);
        }

        // Проверка поддержки
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            status.textContent = '❌ API камеры не поддерживается';
            startBtn.disabled = true;
        } else {
            status.textContent = '✅ API поддерживается. Нажми кнопку.';
        }

        startBtn.addEventListener('click', async () => {
            try {
                status.textContent = '⏳ Запрос доступа к камере...';
                errorLog.style.display = 'none';

                // ВАЖНО: только video, без audio — чтобы не запрашивать микрофон
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                    // audio убран намеренно
                });

                video.srcObject = stream;
                video.style.display = 'block';

                startBtn.disabled = true;
                captureBtn.disabled = false;
                stopBtn.disabled = false;
                status.textContent = '✅ Камера активна!';

            } catch (err) {
                showError('Ошибка: ' + err.name + ' — ' + err.message);
                if (err.name === 'NotAllowedError') {
                    status.textContent = '❌ Доступ запрещён';
                } else if (err.name === 'NotFoundError') {
                    status.textContent = ' Камера не найдена';
                } else if (err.name === 'NotReadableError') {
                    status.textContent = '❌ Камера занята';
                } else {
                    status.textContent = '❌ Ошибка: ' + err.name;
                }
            }
        });

        captureBtn.addEventListener('click', () => {
            if (!stream) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            photo.src = canvas.toDataURL('image/png');
            photo.style.display = 'block';
            status.textContent = '📸 Фото сделано!';
        });

        stopBtn.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            video.style.display = 'none';
            video.srcObject = null;
            startBtn.disabled = false;
            captureBtn.disabled = true;
            stopBtn.disabled = true;
            status.textContent = ' Остановлено';
        });
    </script>
</body>
</html>
