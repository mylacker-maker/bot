<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rotate Test</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f0f1a;
    color: #fff;
    font-family: Arial, sans-serif;
}

#app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 20px;
    padding: 20px;
}

h1 {
    color: #a78bfa;
    font-size: 24px;
    text-align: center;
}

button {
    padding: 20px 40px;
    background: #a78bfa;
    color: #0f0f1a;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    max-width: 300px;
}
button:active { transform: scale(0.95); }

#status {
    color: #888;
    font-size: 14px;
    text-align: center;
    margin-top: 20px;
}

.badge {
    display: inline-block;
    padding: 4px 12px;
    background: #a78bfa33;
    border: 1px solid #a78bfa;
    border-radius: 20px;
    color: #a78bfa;
    font-size: 14px;
    margin-top: 10px;
    word-break: break-all;
    max-width: 90%;
    text-align: center;
}
</style>
</head>
<body>

<div id="app">
    <h1>🎮 Rotate Test 2</h1>
    <p>Смена ориентации через hash</p>

    <button onclick="rotate(1)">📱 Ориентация 1 (приложение)</button>
    <button onclick="rotate(2)">🖥 Ориентация 2 (игра)</button>

    <div id="status">Текущая ориентация: не выбрана</div>
    <div class="badge" id="urlBadge">URL: -</div>
</div>

<script>
// ===== СМЕНА ОРИЕНТАЦИИ ЧЕРЕЗ HASH =====
function rotate(mode) {
    // Хэш с уникальным суффиксом — гарантирует изменение URL
    window.location.hash = "r" + mode + "_" + Date.now();
    
    updateStatus(mode);
    console.log("[ROTATE] hash изменён на: #r" + mode);
}

// ===== ОБНОВЛЕНИЕ СТАТУСА =====
function updateStatus(mode) {
    const status = document.getElementById('status');
    const badge = document.getElementById('urlBadge');
    
    if (mode == 1) {
        status.textContent = "Текущая ориентация: 📱 Приложение (портрет)";
    } else if (mode == 2) {
        status.textContent = "Текущая ориентация: 🖥 Игра (ландшафт)";
    } else {
        status.textContent = "Текущая ориентация: не выбрана";
    }
    
    badge.textContent = "URL: " + window.location.pathname + window.location.search + window.location.hash;
}

// ===== РАСПОЗНАВАНИЕ РЕЖИМА ИЗ HASH =====
function parseMode() {
    const hash = window.location.hash.replace('#', '');
    // Формат: r1_1234567890 или r2_1234567890
    const match = hash.match(/^r([12])_/);
    return match ? match[1] : null;
}

// ===== ПРИ ЗАГРУЗКЕ =====
window.addEventListener('load', () => {
    // Инициализация — выставляем дефолтный hash
    if (!window.location.hash) {
        window.location.hash = "init";
    }
    
    const mode = parseMode();
    if (mode) updateStatus(mode);
});

// ===== СЛЕДИМ ЗА ИЗМЕНЕНИЕМ HASH =====
window.addEventListener('hashchange', () => {
    const mode = parseMode();
    updateStatus(mode || null);
});

// ===== ПЕРВОНАЧАЛЬНЫЙ СТАТУС =====
const initialMode = parseMode();
if (initialMode) updateStatus(initialMode);
</script>

</body>
</html>
